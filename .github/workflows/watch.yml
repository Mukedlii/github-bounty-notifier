name: GitHub bounty notifier (stopped)

# Notifications disabled at the owner's request. Previous configuration is in git history.
on:
  push:
    paths: ['.github/workflows/watch.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounty-notifier
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Notifier stopped
        run: echo 'Bounty notifications are disabled.'
